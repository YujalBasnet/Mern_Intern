<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form>
        <label for="name">Name:</label>
        <input required type="text" placeholder="Ex. John Doe" name="name">        
        <br>
        <br>
        <label for="email">Email:</label>
        <input required type="email" placeholder="Ex. John@gmail.com" name="email">
        <br>
        <br>
        <input type="submit" value="Submit">
         <br>
         <br>
         <input type ="range" min="0" max="20" value="50" name="range">
    </form>
</body>
</html>
