<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOP_WATCh</title>
</head>
<body>
    <div class="container">

        <div class="stopwatch">

            <div id="D" class="display">
                00 : 00 : 00
            </div>

            <div class="buttons">

                <button id="S" class="start">
                    start
                </button>

                <button id="P" class="pause">
                    pause
                </button>

                <button id="R" class="reset">
                    reset
                </button>

            </div>

        </div>

    </div>
</body>
</html>
