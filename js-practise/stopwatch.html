<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOP_WATCh</title>
    <link rel="stylesheet" href="stopwatch.css">
    <script src="stopwatch.js" defer></script>
</head>
<body>
    <div class="container">

        <div class="stopwatch">

            <div id="di" class="display">
                00 : 00 : 00
            </div>

            <div class="buttons">

                <button id="St" class="start">
                    start
                </button>

                <button id="Pa" class="pause">
                    pause
                </button>

                <button id="Re" class="reset">
                    reset
                </button>

            </div>

        </div>

    </div>
</body>
</html>
