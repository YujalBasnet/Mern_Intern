<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="card">

        <div class="left">
           
            <img class = "i" src="https://www.tvmkart.com/wp-content/uploads/2020/10/normal-register-book.jpg" alt="image">
        </div>

        <div class="right">
            <h1>Register</h1>
            
            <form>
      <label>Name: </label>
      <input
        value="jhon"
        name="userName"
        required
        type="text"
        placeholder="Ex. Jhon Deo"
      />
      <br />
      <br />
      <label>Phone: </label>
      <input name="phone" type="number" placeholder="Ex. 98xxxxxxxx" />
      <br />
      <br />
      <input name="email" type="email" placeholder="Enter Email" />
      <br />
      <br />
      <input name="password" type="password" placeholder="Enter Password" />
      <br />
      <br />
      
      <select>
        <option value="">--Select Your Country--</option>
        <option selected value="nepal">Nepal</option>
        <option value="india">India</option>
        <option value="china">China</option>
      </select>
      <br />
      <br />
      <input type="" />
      <br />
      <br />
      <input type="submit" value="Submit" />
      <input type="reset" value="Reset" />
    </form>
        </div>

    </div>
</div>

</body>
</html>
